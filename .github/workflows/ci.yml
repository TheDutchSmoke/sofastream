name: CI
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Dependencies
        run: |
          brew install streamlink
          npm ci --prefix app/gui-importer --no-audit --no-fund
          python3 -m pip install -r app/remote-requirements.txt
      - name: fzf 0.74.4 (mouse escape-sequence fixes)
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64; checksum=4f6a113bfc0c7959e0005c78d566a51afc4fcefc956f43735c62a9deb19e92ae ;;
            x86_64) arch=amd64; checksum=2d392b50be66e2ab104ccd52a6072df692b1f9b9c5b449a9c098de885f32c4c5 ;;
            *) exit 1 ;;
          esac
          archive="$RUNNER_TEMP/fzf.tar.gz"
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-darwin_$arch.tar.gz" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/fzf-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/fzf-bin"
          echo "$RUNNER_TEMP/fzf-bin" >> "$GITHUB_PATH"
      - name: Syntax
        run: |
          zsh -n app/tv.zsh bin/tv bin/tv-dev scripts/setup
          node --check app/playback.mjs
          python3 -m compileall -q app -x 'node_modules'
      - name: Isolated fixtures (no Apple TV)
        run: |
          python3 app/test_tui.py
          python3 app/test_commands.py
          python3 app/test_settings.py
          python3 app/test_remote.py
          node --test app/gui-importer/import.test.mjs
          node app/test_playback.mjs
          ./bin/tv --version
          ./bin/tv-dev --version
          python3 app/test_interaction.py
          python3 app/test_interaction.py --narrow
