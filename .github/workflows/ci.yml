name: CI
on:
  push:
    branches: [main, development]
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Dependencies
        run: |
          brew install fzf streamlink
          npm ci --prefix app/gui-importer --no-audit --no-fund
      - name: Syntax
        run: |
          zsh -n app/tv.zsh bin/tv bin/tv-dev scripts/setup
          node --check app/playback.mjs
          python3 -m compileall -q app -x 'node_modules'
      - name: Isolated fixtures (no Apple TV)
        run: |
          python3 app/test_tui.py
          python3 app/test_commands.py
          node --test app/gui-importer/import.test.mjs
          node app/test_playback.mjs
          ./bin/tv --version
          ./bin/tv-dev --version
